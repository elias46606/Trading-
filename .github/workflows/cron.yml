# Reserve-Zeitschaltuhr — ZEITPLAN PAUSIERT.
#
# Der automatische Schedule ist bewusst deaktiviert, damit keine
# Fehler-Mails mehr entstehen (die Datenbank muss erst wieder laufen).
# Der schnelle Minutentakt läuft ohnehin über cron-job.org.
#
# Wieder aktivieren: den "schedule:"-Block unten einkommentieren.

name: Worker-Takt (Reserve)

on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: /api/cron aufrufen (best effort, mit Wiederholung)
        run: |
          URL="https://trading-peach-theta.vercel.app/api/cron?key=mc-2913206236036e90"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 55 "$URL" || echo "000")
            echo "Versuch $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Zyklus ok."
              exit 0
            fi
            sleep 10
          done
          echo "Kein 200 nach 3 Versuchen — Reserve-Tick übersprungen (kein Fehler)."
          exit 0
